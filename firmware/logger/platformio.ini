; The logger for the Waveshare ESP32-S3-ETH (16 MB flash, 8 MB PSRAM). Open
; this folder (firmware/logger) in PlatformIO. lib_dir shares the HSFZ client
; and the logger library with the spike and the host tests.
[platformio]
lib_dir = ../lib

[env:waveshare-s3-eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
