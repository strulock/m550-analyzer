; HSFZ spike for the Waveshare ESP32-S3-ETH. Open this folder (firmware/spike)
; in PlatformIO. The HSFZ client comes from the shared firmware/lib folder.
;
; Uses the pioarduino platform (Arduino-ESP32 3.x): the stock espressif32
; platform still ships Arduino 2.x, which lacks the W5500 driver used here.
[platformio]
lib_dir = ../lib

[env:waveshare-s3-eth]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
