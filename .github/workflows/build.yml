name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build
        shell: cmd
        run: build.bat

      # A data file missing from the bundle only hides that module's
      # channels at runtime, so check the built exe has them all.
      - name: Self-test the built exe
        shell: cmd
        run: dist\n63read-cli.exe selftest

      # The per-user installer, BMW-Analyzer-Setup.exe, versioned from pyproject.
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH = "$inno;$env:PATH"
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          iscc /Q "/DAppVersion=$version" installer\BMW-Analyzer.iss
          if (-not (Test-Path dist\BMW-Analyzer-Setup.exe)) { exit 1 }

      # Install it silently as a user would, run the installed exe, uninstall.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          Start-Process dist\BMW-Analyzer-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART"
          $app = "$env:LOCALAPPDATA\Programs\BMW Analyzer"
          & "$app\n63read-cli.exe" selftest
          if ($LASTEXITCODE) { exit 1 }
          $docs = [Environment]::GetFolderPath("MyDocuments")
          if (-not (Test-Path "$docs\BMW Analyzer Logs")) { throw "no logs folder" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{15CE8A75-71CE-4317-BF3E-1730307815CD}_is1"
          "installed version: " + (Get-ItemProperty $key).DisplayVersion
          Start-Process "$app\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if (Test-Path "$app\n63read.exe") { throw "uninstall left the exe" }

      # Checksums for the app's self-update, which also uses GitHub's own
      # asset digests when they are there.
      - name: Checksums
        run: >
          python -c "import hashlib; open('dist/SHA256SUMS.txt', 'w').write(''.join(
          '%s  %s\n' % (hashlib.sha256(open('dist/' + n, 'rb').read()).hexdigest(), n)
          for n in ('n63read.exe', 'n63read-cli.exe', 'BMW-Analyzer-Setup.exe')))"

      - uses: actions/upload-artifact@v4
        with:
          name: n63read
          path: |
            dist/n63read.exe
            dist/n63read-cli.exe
            dist/BMW-Analyzer-Setup.exe
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/n63read.exe
            dist/n63read-cli.exe
            dist/BMW-Analyzer-Setup.exe
            dist/SHA256SUMS.txt
