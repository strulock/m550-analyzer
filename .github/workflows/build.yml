name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build
        shell: cmd
        run: build.bat

      # A data file missing from the bundle only hides that module's
      # channels at runtime, so check the built exe has them all.
      - name: Self-test the built exe
        shell: cmd
        run: dist\n63read-cli.exe selftest

      # Checksums for the app's self-update, which also uses GitHub's own
      # asset digests when they are there.
      - name: Checksums
        run: >
          python -c "import hashlib; open('dist/SHA256SUMS.txt', 'w').write(''.join(
          '%s  %s\n' % (hashlib.sha256(open('dist/' + n, 'rb').read()).hexdigest(), n)
          for n in ('n63read.exe', 'n63read-cli.exe')))"

      - uses: actions/upload-artifact@v4
        with:
          name: n63read
          path: |
            dist/n63read.exe
            dist/n63read-cli.exe
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/n63read.exe
            dist/n63read-cli.exe
            dist/SHA256SUMS.txt
