name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test tools
        run: python -m pip install pyinstaller pytest

      - name: Test
        run: python -m pytest -q

      - name: Build
        shell: cmd
        run: build.bat

      # A data file missing from the bundle only hides that module's
      # channels at runtime, so check the built exe has them all.
      - name: Self-test the built exe
        shell: cmd
        run: '"dist\BMW Analyzer\n63read-cli.exe" selftest'

      # Claude talks to `n63read-cli mcp` over stdin/stdout: nothing but
      # protocol may come out, and the handshake must work in the built exe.
      - name: Check the built exe's MCP server
        shell: pwsh
        run: |
          $out = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' | & "dist\BMW Analyzer\n63read-cli.exe" mcp
          $reply = $out | ConvertFrom-Json
          if ($reply.result.serverInfo.name -ne "n63read") { throw "no MCP handshake: $out" }
          "MCP ok: $($reply.result.protocolVersion)"

      # The same folder, zipped, for running without installing.
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\BMW Analyzer" -DestinationPath dist\BMW-Analyzer-portable.zip

      # The per-user installer, BMW-Analyzer-Setup.exe, versioned from pyproject.
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:PATH = "$inno;$env:PATH"
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          iscc /Q "/DAppVersion=$version" installer\BMW-Analyzer.iss
          if (-not (Test-Path dist\BMW-Analyzer-Setup.exe)) { exit 1 }

      # Install it silently as a user would, run the installed exe, uninstall.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          Start-Process dist\BMW-Analyzer-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART"
          $app = "$env:LOCALAPPDATA\Programs\BMW Analyzer"
          & "$app\n63read-cli.exe" selftest
          if ($LASTEXITCODE) { exit 1 }
          $docs = [Environment]::GetFolderPath("MyDocuments")
          if (-not (Test-Path "$docs\BMW Analyzer Logs")) { throw "no logs folder" }
          if (-not (Test-Path "$app\_internal")) { throw "no _internal folder" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{15CE8A75-71CE-4317-BF3E-1730307815CD}_is1"
          $entry = Get-ItemProperty $key
          "installed version $($entry.DisplayVersion) in $($entry.InstallLocation)"
          # The app itself starts and opens its window, not just the CLI.
          $gui = Start-Process "$app\n63read.exe" -PassThru
          Start-Sleep 8
          $gui.Refresh()
          if ($gui.HasExited) { throw "the app exited at start (code $($gui.ExitCode))" }
          "app window: " + (Get-Process -Id $gui.Id).MainWindowTitle
          Stop-Process -Id $gui.Id -Force
          Start-Sleep 1
          # The app updates itself this way: the same installer, silent, over
          # itself. Do it while Claude's n63read connection (n63read-cli mcp)
          # holds files in the folder, as on the car laptop: the app must still
          # start afterwards.
          $psi = [System.Diagnostics.ProcessStartInfo]::new("$app\n63read-cli.exe", "mcp")
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.UseShellExecute = $false
          # Its own (hidden) console: the installer closes it with Ctrl+C, which
          # would otherwise reach this script too.
          $psi.CreateNoWindow = $true
          $mcp = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep 3
          Start-Process dist\BMW-Analyzer-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/CLOSEAPPLICATIONS"
          if (-not $mcp.HasExited) { $mcp.Kill(); $mcp.WaitForExit() }
          if (-not (Test-Path "$app\_internal\base_library.zip")) { throw "the update left _internal incomplete" }
          & "$app\n63read-cli.exe" --version
          if ($LASTEXITCODE) { exit 1 }
          Start-Process dist\BMW-Analyzer-Setup.exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/CLOSEAPPLICATIONS"
          & "$app\n63read-cli.exe" selftest
          if ($LASTEXITCODE) { exit 1 }
          Start-Process "$app\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if (Test-Path "$app\n63read.exe") { throw "uninstall left the exe" }
          if (Test-Path "$app\_internal") { throw "uninstall left _internal" }

      # Checksums for the app's self-update, which also uses GitHub's own
      # asset digests when they are there.
      - name: Checksums
        run: >
          python -c "import hashlib; open('dist/SHA256SUMS.txt', 'w').write(''.join(
          '%s  %s\n' % (hashlib.sha256(open('dist/' + n, 'rb').read()).hexdigest(), n)
          for n in ('BMW-Analyzer-Setup.exe', 'BMW-Analyzer-portable.zip')))"

      - uses: actions/upload-artifact@v4
        with:
          name: n63read
          path: |
            dist/BMW-Analyzer-Setup.exe
            dist/BMW-Analyzer-portable.zip
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BMW-Analyzer-Setup.exe
            dist/BMW-Analyzer-portable.zip
            dist/SHA256SUMS.txt
